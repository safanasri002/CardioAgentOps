services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    env_file: .env
    ports:
      - "8000:8000"
    networks: [docker-network]

  audio-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.audio-engine
    ports:
      - "8003:8003"
    networks: [docker-network]

networks:
  docker-network:
    driver: bridge