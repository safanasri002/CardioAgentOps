# Service 6 — mlflow-server : pas de code à tester -> build + smoke test + push
name: mlflow-server

on:
  push:
    branches: [main]
    paths: ["mlflow-server/**", ".github/workflows/mlflow-server.yml"]
  pull_request:
    branches: [main]
    paths: ["mlflow-server/**", ".github/workflows/mlflow-server.yml"]

defaults:
  run:
    working-directory: mlflow-server

jobs:
  # ---------- CD : build -> smoke test /health -> push ghcr.io (seulement sur main) ----------
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mlflow-server
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Smoke test (le conteneur démarre et répond sur /health)
        run: |
          docker run -d --name svc -p 5000:5000 $IMAGE:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/health; then echo; echo "OK"; exit 0; fi
            sleep 2
          done
          echo "Le service ne répond pas :"; docker logs svc; exit 1

      - name: Login ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
